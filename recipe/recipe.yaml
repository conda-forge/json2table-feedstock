schema_version: 1

context:
  name: json2table
  version: "1.1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/json2table-${{ version }}.tar.gz
  sha256: 838e4c052276252fec7b0dbd10668258ce0997605888a250307bd6b124ae6d0a

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - json2table
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Convert JSON to an HTML table
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/latture/json2table

extra:
  recipe-maintainers:
    - jan-janssen
